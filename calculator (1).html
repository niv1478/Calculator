<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מחשבון</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f4f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .calc {
      background: #ffffff;
      border: 1px solid #e0dfd8;
      border-radius: 16px;
      width: 300px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    .display {
      padding: 1.5rem 1.25rem 1rem;
      border-bottom: 1px solid #e0dfd8;
      text-align: right;
      min-height: 90px;
    }

    .expr {
      font-size: 13px;
      color: #999;
      min-height: 18px;
      margin-bottom: 6px;
      word-break: break-all;
    }

    .result {
      font-size: 38px;
      font-weight: 500;
      color: #1a1a1a;
      word-break: break-all;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }

    .btn {
      border: none;
      border-right: 1px solid #e0dfd8;
      border-bottom: 1px solid #e0dfd8;
      background: #ffffff;
      color: #1a1a1a;
      font-size: 17px;
      font-weight: 400;
      height: 65px;
      cursor: pointer;
      transition: background 0.1s;
      font-family: inherit;
    }

    .btn:hover { background: #f5f4f0; }
    .btn:active { background: #eceae4; }

    .btn.op { color: #185FA5; font-weight: 500; }
    .btn.func { color: #666; font-size: 15px; }

    .btn.eq {
      background: #185FA5;
      color: #fff;
      font-size: 22px;
      border-right: none;
    }
    .btn.eq:hover { background: #0C447C; }
    .btn.eq:active { background: #042C53; }

    .btn.zero { grid-column: span 2; }

    .grid .btn:nth-child(4n) { border-right: none; }
  </style>
</head>
<body>
  <div class="calc">
    <div class="display">
      <div class="expr" id="expr"></div>
      <div class="result" id="result">0</div>
    </div>
    <div class="grid" id="grid">
      <button class="btn func" data-action="ac">AC</button>
      <button class="btn func" data-action="sign">+/−</button>
      <button class="btn func" data-action="percent">%</button>
      <button class="btn op" data-action="op" data-val="÷">÷</button>

      <button class="btn" data-action="num" data-val="7">7</button>
      <button class="btn" data-action="num" data-val="8">8</button>
      <button class="btn" data-action="num" data-val="9">9</button>
      <button class="btn op" data-action="op" data-val="×">×</button>

      <button class="btn" data-action="num" data-val="4">4</button>
      <button class="btn" data-action="num" data-val="5">5</button>
      <button class="btn" data-action="num" data-val="6">6</button>
      <button class="btn op" data-action="op" data-val="−">−</button>

      <button class="btn" data-action="num" data-val="1">1</button>
      <button class="btn" data-action="num" data-val="2">2</button>
      <button class="btn" data-action="num" data-val="3">3</button>
      <button class="btn op" data-action="op" data-val="+">+</button>

      <button class="btn zero" data-action="num" data-val="0">0</button>
      <button class="btn" data-action="dot">.</button>
      <button class="btn eq" data-action="eq">=</button>
    </div>
  </div>

  <script>
    let cur = '0', prev = null, op = null, fresh = false;
    const rEl = document.getElementById('result');
    const eEl = document.getElementById('expr');

    function display(v) {
      let s = parseFloat(v).toString();
      if (s.length > 10) s = parseFloat(v).toExponential(4);
      rEl.textContent = s;
    }

    function calc(a, b, o) {
      a = parseFloat(a); b = parseFloat(b);
      if (o === '+') return a + b;
      if (o === '−') return a - b;
      if (o === '×') return a * b;
      if (o === '÷') return b !== 0 ? a / b : 'שגיאה';
    }

    document.getElementById('grid').addEventListener('click', e => {
      const btn = e.target.closest('.btn');
      if (!btn) return;
      const { action, val } = btn.dataset;

      if (action === 'num') {
        if (cur === '0' || fresh) { cur = val; fresh = false; }
        else if (cur.length < 12) cur += val;
        display(cur);
      } else if (action === 'dot') {
        if (fresh) { cur = '0'; fresh = false; }
        if (!cur.includes('.')) cur += '.';
        rEl.textContent = cur;
      } else if (action === 'op') {
        if (op && !fresh) {
          const res = calc(prev, cur, op);
          cur = String(res);
          display(cur);
        }
        prev = cur; op = val; fresh = true;
        eEl.textContent = prev + ' ' + op;
      } else if (action === 'eq') {
        if (!op) return;
        eEl.textContent = prev + ' ' + op + ' ' + cur + ' =';
        const res = calc(prev, cur, op);
        cur = String(res);
        display(cur);
        op = null; fresh = true;
      } else if (action === 'ac') {
        cur = '0'; prev = null; op = null; fresh = false;
        rEl.textContent = '0'; eEl.textContent = '';
      } else if (action === 'sign') {
        cur = String(parseFloat(cur) * -1);
        display(cur);
      } else if (action === 'percent') {
        cur = String(parseFloat(cur) / 100);
        display(cur);
      }
    });
  </script>
</body>
</html>
